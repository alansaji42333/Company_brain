services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: company_brain
      POSTGRES_USER: company_brain
      POSTGRES_PASSWORD: company_brain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_brain"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://company_brain:company_brain@db:5432/company_brain
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/skills:/app/data/skills
      - ./data/.last_synthesis_at:/app/data/.last_synthesis_at
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
