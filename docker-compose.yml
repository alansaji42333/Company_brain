services:
  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/skills:/app/data/skills
      - ./data/.last_synthesis_at:/app/data/.last_synthesis_at
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped