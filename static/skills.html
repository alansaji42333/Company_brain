<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Brain — Skills</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 960px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
  h1 { margin-bottom: 20px; color: #333; }
  .nav { margin-bottom: 20px; }
  .nav a { color: #007aff; text-decoration: none; margin-right: 16px; }
  .nav a:hover { text-decoration: underline; }
  table { width: 100%; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-collapse: collapse; overflow: hidden; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #fafafa; font-weight: 600; color: #555; }
  tr:hover { background: #f0f7ff; cursor: pointer; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.85em; font-weight: 500; }
  .status.draft { background: #fff3cd; color: #856404; }
  .status.approved { background: #d4edda; color: #155724; }
  .status.rejected { background: #f8d7da; color: #721c24; }
  .detail { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; }
  .detail h2 { margin-bottom: 16px; }
  .detail .meta { color: #666; font-size: 0.9em; margin-bottom: 16px; }
  .detail textarea { width: 100%; min-height: 300px; padding: 12px; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 0.9em; border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
  .detail textarea:focus { border-color: #007aff; outline: none; }
  .btn-row { margin-top: 12px; display: flex; gap: 8px; }
  .btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 0.95em; cursor: pointer; }
  .btn:hover { opacity: 0.9; }
  .btn-save { background: #007aff; color: #fff; }
  .btn-approve { background: #28a745; color: #fff; }
  .btn-reject { background: #dc3545; color: #fff; }
  .btn-back { background: #6c757d; color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { text-align: center; color: #888; padding: 40px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<h1>Skill Documents</h1>
<div class="nav">
  <a href="/">Chat</a>
  <a href="/skills-page">Skills</a>
</div>
<div id="app"></div>
<script>
  const API = '';
  let currentId = null;

  function getAuthToken() {
    return localStorage.getItem('auth_token') || prompt('Enter your user token:');
  }

  async function api(method, path, body) {
    const opts = { method, headers: { 'Authorization': 'Bearer ' + getAuthToken() } };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(API + path, opts);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function render() {
    if (currentId) return renderDetail();
    renderList();
  }

  async function renderList() {
    const app = document.getElementById('app');
    app.innerHTML = '<p>Loading...</p>';
    try {
      const data = await api('GET', '/skills');
      const skills = data.skills || [];
      if (skills.length === 0) {
        app.innerHTML = '<div class="empty">No skill documents yet. Run <code>python -m app.cli synthesize</code> to generate them.</div>';
        return;
      }
      let html = '<table><thead><tr><th>Title</th><th>Status</th><th>Created</th></tr></thead><tbody>';
      skills.forEach(s => {
        const statusClass = s.status || 'draft';
        html += `<tr onclick="openSkill('${s.id}')">
          <td>${s.title}</td>
          <td><span class="status ${statusClass}">${statusClass}</span></td>
          <td>${s.created_at ? new Date(s.created_at).toLocaleDateString() : ''}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      app.innerHTML = html;
    } catch (e) {
      app.innerHTML = `<div class="empty error">Error loading skills: ${e.message}</div>`;
    }
  }

  async function openSkill(id) {
    currentId = id;
    render();
  }

  async function renderDetail() {
    const app = document.getElementById('app');
    app.innerHTML = '<p>Loading...</p>';
    try {
      const s = await api('GET', '/skills/' + currentId);
      const statusClass = s.status || 'draft';
      app.innerHTML = `
        <div class="detail">
          <button class="btn btn-back" onclick="backToList()">← Back</button>
          <h2>${s.title}</h2>
          <div class="meta">
            ID: ${s.id} &nbsp;|&nbsp;
            Status: <span class="status ${statusClass}">${s.status}</span> &nbsp;|&nbsp;
            Created: ${s.created_at ? new Date(s.created_at).toLocaleString() : ''} &nbsp;|&nbsp;
            Updated: ${s.updated_at ? new Date(s.updated_at).toLocaleString() : ''}
          </div>
          <textarea id="skill-body">${s.content || ''}</textarea>
          <div class="btn-row">
            <button class="btn btn-save" onclick="saveSkill()">Save</button>
            <button class="btn btn-approve" onclick="approveSkill()">Approve</button>
            <button class="btn btn-reject" onclick="rejectSkill()">Reject</button>
          </div>
        </div>
      `;
    } catch (e) {
      app.innerHTML = `<div class="empty error">Error loading skill: ${e.message}</div>`;
    }
  }

  async function saveSkill() {
    const body = document.getElementById('skill-body').value;
    try {
      await api('PUT', '/skills/' + currentId, { content: body });
      alert('Saved');
    } catch (e) {
      alert('Error saving: ' + e.message);
    }
  }

  async function approveSkill() {
    if (!confirm('Approve this skill doc? It will be embedded for retrieval.')) return;
    try {
      await api('POST', '/skills/' + currentId + '/approve');
      currentId = null;
      render();
    } catch (e) {
      alert('Error approving: ' + e.message);
    }
  }

  async function rejectSkill() {
    if (!confirm('Reject this skill doc? It will be removed from retrieval.')) return;
    try {
      await api('POST', '/skills/' + currentId + '/reject');
      currentId = null;
      render();
    } catch (e) {
      alert('Error rejecting: ' + e.message);
    }
  }

  function backToList() {
    currentId = null;
    render();
  }

  render();
</script>
</body>
</html>
